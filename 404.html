<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Primary Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 - Page Not Found | GENIQ</title>

  <meta name="description" content="The page you requested could not be found. Return to GENIQ homepage.">
  <meta name="theme-color" id="metaThemeColor" content="#f8fafc">
  <meta name="color-scheme" content="light dark">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ULTRA GLASSMORPHIC DESIGN SYSTEM (MATCHED WITH JI.HTML)
       ========================================================================== */
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --card-subtle: #f1f5f9;
      --card-glass: rgba(255, 255, 255, 0.88);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --text-muted: #94a3b8;

      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --primary-light: #eef2ff;
      --glow-color: rgba(79, 70, 229, 0.25);

      --border-color: #e2e8f0;
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;

      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 24px 48px rgba(15, 23, 42, 0.12);

      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark-theme {
      --bg-main: #070a12;
      --card-bg: #121929;
      --card-subtle: #1a2336;
      --card-glass: rgba(18, 25, 41, 0.90);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;

      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --primary-light: #1e1b4b;
      --glow-color: rgba(99, 102, 241, 0.35);

      --border-color: rgba(255, 255, 255, 0.08);
      --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: absolute;
      width: 380px;
      height: 380px;
      background: var(--primary-gradient);
      filter: blur(150px);
      opacity: 0.2;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    /* Header Bar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: calc(64px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 14px var(--glow-color);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-light);
      padding: 6px 14px 6px 8px;
      border-radius: 22px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .user-pill:active { transform: scale(0.96); }

    .user-pill-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-pill-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* Central Card */
    .card-404 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 28px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Minimal Icon Badge */
    .icon-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px auto;
      border-radius: 20px;
      background: var(--primary-light);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: 0 8px 20px var(--glow-color);
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .error-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Buttons Group */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 26px;
      font-size: 0.88rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      text-decoration: none;
    }

    .btn-pill:active { transform: scale(0.96); }

    .btn-primary {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 16px var(--glow-color);
    }

    .btn-outline {
      background: var(--card-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    /* Redirect Timer Badge */
    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 22px;
      background: var(--card-subtle);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .timer-badge span {
      color: var(--primary);
      font-weight: 800;
    }

    /* Universal SVG Icon Style */
    .svg-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>

<body>

  <div class="bg-glow"></div>

  <!-- Header -->
  <header class="app-header">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      GENIQ
    </a>

    <div class="user-pill" onclick="toggleTheme()">
      <div class="user-pill-icon">
        <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </div>
      <span class="user-pill-name" id="themeLabel">Light UI</span>
    </div>
  </header>

  <!-- Central Card -->
  <main class="card-404">
    <div class="icon-badge">
      <svg class="svg-icon" style="width: 28px; height: 28px;" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>

    <div class="btn-group">
      <a href="index.html" class="btn-pill btn-primary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return to Homepage
      </a>
      <button onclick="goBackSafe()" class="btn-pill btn-outline">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Go Back
      </button>
    </div>

    <div class="timer-badge">
      <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Auto-redirecting in <span id="countdown">10</span>s
    </div>
  </main>

  <script>
    // Theme Manager (Synchronized with ji.html)
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("geniq_theme") || "light";
      applyTheme(savedTheme);

      window.addEventListener("storage", (e) => {
        if (e.key === "geniq_theme") {
          applyTheme(e.newValue);
        }
      });
    });

    function applyTheme(theme) {
      if (theme === "dark") {
        document.body.classList.add("dark-theme");
        document.getElementById("themeLabel").textContent = "Dark UI";
        document.getElementById("metaThemeColor").setAttribute("content", "#070a12");
      } else {
        document.body.classList.remove("dark-theme");
        document.getElementById("themeLabel").textContent = "Light UI";
        document.getElementById("metaThemeColor").setAttribute("content", "#f8fafc");
      }
      localStorage.setItem("geniq_theme", theme);
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains("dark-theme");
      applyTheme(isDark ? "light" : "dark");
    }

    // Safe Back Navigation Guard
    function goBackSafe() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // Countdown Auto-Redirect Engine
    let seconds = 10;
    const countdownElem = document.getElementById('countdown');

    const timer = setInterval(() => {
      seconds--;
      if (countdownElem) countdownElem.textContent = seconds;
      
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>
</body>

</html>
