<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Primary Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 - Page Not Found | GENIQ</title>

  <meta name="description" content="The page you requested could not be found. Return to GENIQ homepage.">
  <meta name="theme-color" id="metaThemeColor" content="#f8fafc">
  <meta name="color-scheme" content="light dark">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ULTRA GLASSMORPHIC DESIGN SYSTEM (ENHANCED)
       ========================================================================== */
    :root {
      --bg-main: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-subtle: #f1f5f9;
      --card-glass: rgba(255, 255, 255, 0.75);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --text-muted: #94a3b8;

      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --primary-light: #eef2ff;
      --glow-color: rgba(79, 70, 229, 0.25);

      --border-color: rgba(226, 232, 240, 0.8);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;

      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 24px 48px rgba(15, 23, 42, 0.1);

      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark-theme {
      --bg-main: #070a12;
      --card-bg: rgba(18, 25, 41, 0.85);
      --card-subtle: #1a2336;
      --card-glass: rgba(18, 25, 41, 0.75);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;

      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --primary-light: rgba(30, 27, 75, 0.6);
      --glow-color: rgba(99, 102, 241, 0.35);

      --border-color: rgba(255, 255, 255, 0.1);
      --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Interactive Background Glow & Floating Orbs */
    .bg-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: var(--primary-gradient);
      filter: blur(160px);
      opacity: 0.22;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      transition: transform 0.2s ease-out;
    }

    .ambient-orb {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      filter: blur(90px);
      opacity: 0.15;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      animation: orbFloat 10s infinite alternate ease-in-out;
    }

    @keyframes orbFloat {
      0% { transform: translate(-30px, -30px); }
      100% { transform: translate(30px, 30px); }
    }

    /* Header Bar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: calc(64px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-glass);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      background: var(--primary-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .brand-logo:hover { transform: scale(1.03); }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 14px var(--glow-color);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-light);
      padding: 6px 14px 6px 8px;
      border-radius: 22px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .user-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--glow-color);
    }

    .user-pill:active { transform: scale(0.96); }

    .user-pill-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-pill-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* Central Card */
    .card-404 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 28px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Floating Icon Badge */
    .icon-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px auto;
      border-radius: 22px;
      background: var(--primary-light);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: 0 8px 24px var(--glow-color);
      animation: floatBadge 4s ease-in-out infinite;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: 4.8rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      background: var(--primary-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 10px 30px var(--glow-color);
    }

    .error-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .error-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Buttons Group */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 26px;
      font-size: 0.88rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      text-decoration: none;
    }

    .btn-pill:hover {
      transform: translateY(-2px);
    }

    .btn-pill:active { transform: translateY(0) scale(0.98); }

    .btn-primary {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 6px 20px var(--glow-color);
    }

    .btn-primary:hover {
      box-shadow: 0 10px 28px var(--glow-color);
    }

    .btn-outline {
      background: var(--card-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--border-color);
    }

    /* Redirect Timer Badge & Progress Bar */
    .timer-badge-wrap {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      background: var(--card-subtle);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .timer-badge span {
      color: var(--primary);
      font-weight: 800;
    }

    .pause-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      transition: var(--transition);
    }

    .pause-btn:hover { color: var(--primary); }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--card-subtle);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: var(--primary-gradient);
      transition: width 1s linear;
    }

    /* SVG Icon Style */
    .svg-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>

<body>

  <!-- Ambient Glow Elements -->
  <div class="bg-glow" id="bgGlow"></div>
  <div class="ambient-orb"></div>

  <!-- Header -->
  <header class="app-header">
    <a href="index.html" class="brand-logo" aria-label="GENIQ Homepage">
      <div class="brand-icon">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      GENIQ
    </a>

    <div class="user-pill" onclick="toggleTheme()" role="button" aria-label="Toggle Theme">
      <div class="user-pill-icon" id="themeIcon">
        <!-- Sun/Moon SVG swapped via JS -->
      </div>
      <span class="user-pill-name" id="themeLabel">Light UI</span>
    </div>
  </header>

  <!-- Central Card -->
  <main class="card-404">
    <div class="icon-badge">
      <svg class="svg-icon" style="width: 32px; height: 32px;" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>

    <div class="btn-group">
      <a href="index.html" class="btn-pill btn-primary">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return to Homepage
      </a>
      <button onclick="goBackSafe()" class="btn-pill btn-outline">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Go Back
      </button>
    </div>

    <div class="timer-badge-wrap">
      <div class="timer-badge">
        <svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Auto-redirecting in <span id="countdown">10</span>s
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <button class="pause-btn" id="pauseBtn" onclick="togglePause()">Pause Redirect</button>
    </div>
  </main>

  <script>
    // 1. Interactive Background Mouse Tracking
    const glow = document.getElementById('bgGlow');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX - window.innerWidth / 2) * 0.15;
      const y = (e.clientY - window.innerHeight / 2) * 0.15;
      glow.style.transform = `translate(${x}px, ${y}px)`;
    });

    // 2. Theme Manager (System Pref + LocalStorage Sync)
    const sunIcon = `<svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
    const moonIcon = `<svg class="svg-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    document.addEventListener("DOMContentLoaded", () => {
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem("geniq_theme") || (systemPrefersDark ? "dark" : "light");
      applyTheme(savedTheme);

      window.addEventListener("storage", (e) => {
        if (e.key === "geniq_theme") applyTheme(e.newValue);
      });
    });

    function applyTheme(theme) {
      const themeLabel = document.getElementById("themeLabel");
      const themeIcon = document.getElementById("themeIcon");
      const metaThemeColor = document.getElementById("metaThemeColor");

      if (theme === "dark") {
        document.body.classList.add("dark-theme");
        if(themeLabel) themeLabel.textContent = "Dark UI";
        if(themeIcon) themeIcon.innerHTML = sunIcon;
        if(metaThemeColor) metaThemeColor.setAttribute("content", "#070a12");
      } else {
        document.body.classList.remove("dark-theme");
        if(themeLabel) themeLabel.textContent = "Light UI";
        if(themeIcon) themeIcon.innerHTML = moonIcon;
        if(metaThemeColor) metaThemeColor.setAttribute("content", "#f8fafc");
      }
      localStorage.setItem("geniq_theme", theme);
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains("dark-theme");
      applyTheme(isDark ? "light" : "dark");
    }

    // 3. Safe Back Navigation Guard
    function goBackSafe() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // 4. Countdown Engine with Progress Bar & Pause Option
    let seconds = 10;
    const totalSeconds = 10;
    let isPaused = false;
    const countdownElem = document.getElementById('countdown');
    const progressBar = document.getElementById('progressBar');
    const pauseBtn = document.getElementById('pauseBtn');

    const timer = setInterval(() => {
      if (isPaused) return;

      seconds--;
      if (countdownElem) countdownElem.textContent = seconds;
      if (progressBar) progressBar.style.width = `${(seconds / totalSeconds) * 100}%`;
      
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
      }
    }, 1000);

    function togglePause() {
      isPaused = !isPaused;
      if (pauseBtn) {
        pauseBtn.textContent = isPaused ? "Resume Redirect" : "Pause Redirect";
        pauseBtn.style.color = isPaused ? "var(--primary)" : "var(--text-muted)";
      }
    }
  </script>
</body>

</html>
