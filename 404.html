<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" id="metaThemeColor" content="#f8fafc">
  <meta name="color-scheme" content="light dark">

  <meta
    name="description"
    content="GENIQ — The page you are looking for could not be found."
  >

  <title>404 — Page Not Found | GENIQ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CENTRAL GENIQ THEME SYSTEM -->
  <script src="theme.js" defer></script>

  <style>
    /* =========================================================
       GENIQ 404 — PREMIUM GLASS SYSTEM
       Theme colors are controlled by theme.js
       ========================================================= */

    :root {
      --bg-main: #f8fafc;

      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --surface-soft: rgba(241, 245, 249, 0.72);

      --text-main: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;

      --primary: #4f46e5;
      --primary-2: #7c3aed;

      --gradient:
        linear-gradient(
          135deg,
          #4f46e5 0%,
          #6366f1 45%,
          #7c3aed 100%
        );

      --border: rgba(226, 232, 240, 0.82);

      --glow: rgba(79, 70, 229, 0.22);
      --glow-strong: rgba(99, 102, 241, 0.34);

      --shadow:
        0 30px 80px rgba(15, 23, 42, 0.12);

      --shadow-small:
        0 8px 30px rgba(15, 23, 42, 0.07);

      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 17px;

      --font-main:
        "Plus Jakarta Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --font-mono:
        "JetBrains Mono",
        monospace;

      --transition:
        0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }


    /* =========================================================
       DARK THEME
       theme.js only adds .dark-theme
       ========================================================= */

    body.dark-theme {
      --bg-main: #070a12;

      --surface: rgba(18, 25, 41, 0.78);
      --surface-strong: rgba(18, 25, 41, 0.92);
      --surface-soft: rgba(26, 35, 54, 0.72);

      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --primary: #6366f1;
      --primary-2: #a855f7;

      --gradient:
        linear-gradient(
          135deg,
          #6366f1 0%,
          #818cf8 45%,
          #a855f7 100%
        );

      --border: rgba(255, 255, 255, 0.095);

      --glow: rgba(99, 102, 241, 0.25);
      --glow-strong: rgba(129, 92, 246, 0.4);

      --shadow:
        0 30px 90px rgba(0, 0, 0, 0.48);

      --shadow-small:
        0 8px 30px rgba(0, 0, 0, 0.28);
    }


    /* =========================================================
       RESET
       ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
    }


    html {
      background: var(--bg-main);
    }


    body {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding:
        calc(76px + env(safe-area-inset-top))
        18px
        calc(18px + env(safe-area-inset-bottom));

      background: var(--bg-main);
      color: var(--text-main);

      font-family: var(--font-main);

      transition:
        background-color 0.4s ease,
        color 0.4s ease;
    }


    button,
    a {
      font: inherit;
    }


    button {
      border: 0;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       BACKGROUND
       ========================================================= */

    .page-background {
      position: fixed;
      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 0;
    }


    .grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(100, 116, 139, 0.055) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(100, 116, 139, 0.055) 1px,
          transparent 1px
        );

      background-size: 38px 38px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 20%,
          black 80%,
          transparent
        );

      opacity: 0.55;
    }


    body.dark-theme .grid {
      opacity: 0.25;
    }


    .orb {
      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          var(--primary) 0%,
          transparent 68%
        );

      filter: blur(90px);

      opacity: 0.12;

      animation:
        floatingOrb 11s ease-in-out infinite alternate;
    }


    .orb.one {
      top: -190px;
      left: -150px;
    }


    .orb.two {
      right: -190px;
      bottom: -190px;

      width: 480px;
      height: 480px;

      animation-delay: -4s;
    }


    .orb.three {
      top: 35%;
      left: 50%;

      width: 260px;
      height: 260px;

      transform: translate(-50%, -50%);

      opacity: 0.06;

      animation-delay: -7s;
    }


    @keyframes floatingOrb {
      from {
        transform: translate3d(-20px, -10px, 0) scale(1);
      }

      to {
        transform: translate3d(24px, 25px, 0) scale(1.08);
      }
    }


    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 50;

      height:
        calc(70px + env(safe-area-inset-top));

      padding:
        env(safe-area-inset-top)
        18px
        0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);

      background: var(--surface);

      backdrop-filter:
        blur(24px)
        saturate(180%);

      -webkit-backdrop-filter:
        blur(24px)
        saturate(180%);

      transition:
        background-color 0.4s ease,
        border-color 0.4s ease;
    }


    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      font-size: 1rem;
      font-weight: 900;

      letter-spacing: -0.5px;

      color: var(--text-main);
    }


    .brand-mark {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: var(--gradient);

      color: #fff;

      box-shadow:
        0 8px 22px var(--glow);
    }


    .brand-mark svg {
      width: 21px;
      height: 21px;
    }


    .brand-name span {
      color: var(--primary);
    }


    /* =========================================================
       THEME BUTTON
       theme.js controls it
       ========================================================= */

    #themeBtn {
      min-height: 40px;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 6px 12px 6px 7px;

      border-radius: 22px;

      background: var(--surface-soft);

      border: 1px solid var(--border);

      color: var(--text-secondary);

      cursor: pointer;

      transition:
        transform var(--transition),
        box-shadow var(--transition),
        background-color 0.35s ease;
    }


    #themeBtn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-small);
    }


    #themeBtn:active {
      transform: scale(0.96);
    }


    #themeIconWrap {
      width: 27px;
      height: 27px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--gradient);

      color: #fff;
    }


    #themeIcon {
      width: 14px;
      height: 14px;
    }


    #themeLabel {
      font-size: 0.72rem;
      font-weight: 800;

      white-space: nowrap;
    }


    /* =========================================================
       MAIN CARD
       ========================================================= */

    .error-shell {
      position: relative;
      z-index: 10;

      width: min(100%, 500px);

      animation:
        shellIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }


    @keyframes shellIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    .error-card {
      position: relative;

      overflow: hidden;

      padding: 34px 25px 24px;

      border:
        1px solid var(--border);

      border-radius: var(--radius-xl);

      background: var(--surface);

      backdrop-filter:
        blur(28px)
        saturate(180%);

      -webkit-backdrop-filter:
        blur(28px)
        saturate(180%);

      box-shadow: var(--shadow);

      text-align: center;

      transition:
        background-color 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.4s ease;
    }


    .error-card::before {
      content: "";

      position: absolute;

      top: -150px;
      left: 50%;

      width: 330px;
      height: 250px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          var(--glow-strong),
          transparent 68%
        );

      filter: blur(20px);

      opacity: 0.45;

      pointer-events: none;
    }


    .card-content {
      position: relative;
      z-index: 2;
    }


    /* =========================================================
       404 ICON
       ========================================================= */

    .status-icon {
      width: 72px;
      height: 72px;

      margin: 0 auto 19px;

      display: grid;
      place-items: center;

      border-radius: 23px;

      background: var(--surface-soft);

      border: 1px solid var(--border);

      color: var(--primary);

      box-shadow:
        0 14px 34px var(--glow);

      animation:
        iconFloat 4s ease-in-out infinite;
    }


    .status-icon svg {
      width: 33px;
      height: 33px;

      stroke: currentColor;
      stroke-width: 1.8;

      fill: none;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    @keyframes iconFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }


    /* =========================================================
       ERROR CODE
       ========================================================= */

    .error-code {
      margin-bottom: 7px;

      font-family: var(--font-mono);

      font-size:
        clamp(4rem, 18vw, 6rem);

      font-weight: 800;

      line-height: 0.95;

      letter-spacing: -0.08em;

      background: var(--gradient);

      background-clip: text;
      -webkit-background-clip: text;

      color: transparent;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 13px 26px var(--glow)
        );
    }


    .error-title {
      margin-bottom: 10px;

      font-size: clamp(1.35rem, 5vw, 1.65rem);

      font-weight: 900;

      letter-spacing: -0.7px;

      color: var(--text-main);
    }


    .error-description {
      max-width: 390px;

      margin: 0 auto 23px;

      font-size: 0.84rem;

      line-height: 1.65;

      color: var(--text-secondary);
    }


    /* =========================================================
       LOCATION CHIP
       ========================================================= */

    .location-chip {
      width: fit-content;

      margin: 0 auto 21px;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border-radius: 20px;

      background: var(--surface-soft);

      border: 1px solid var(--border);

      color: var(--text-muted);

      font-family: var(--font-mono);

      font-size: 0.67rem;
      font-weight: 700;
    }


    .location-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--primary);

      box-shadow:
        0 0 0 4px var(--glow);
    }


    /* =========================================================
       ACTIONS
       ========================================================= */

    .actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }


    .action {
      min-height: 49px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 12px 14px;

      border-radius: var(--radius-md);

      font-size: 0.78rem;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform var(--transition),
        box-shadow var(--transition),
        background-color 0.35s ease;
    }


    .action svg {
      width: 17px;
      height: 17px;

      flex: 0 0 auto;

      stroke: currentColor;
      stroke-width: 2.1;

      fill: none;

      stroke-linecap: round;
      stroke-linejoin: round;
    }


    .action-primary {
      color: #fff;

      background: var(--gradient);

      box-shadow:
        0 9px 24px var(--glow);
    }


    .action-secondary {
      color: var(--text-main);

      background: var(--surface-soft);

      border: 1px solid var(--border);
    }


    .action:hover {
      transform: translateY(-2px);
    }


    .action-primary:hover {
      box-shadow:
        0 13px 32px var(--glow-strong);
    }


    .action:active {
      transform: scale(0.97);
    }


    /* =========================================================
       REDIRECT PANEL
       ========================================================= */

    .redirect-panel {
      margin-top: 18px;

      padding: 13px;

      border-radius: var(--radius-lg);

      background: var(--surface-soft);

      border: 1px solid var(--border);

      text-align: left;
    }


    .redirect-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 9px;
    }


    .redirect-info {
      display: flex;
      align-items: center;
      gap: 8px;

      min-width: 0;
    }


    .redirect-icon {
      width: 28px;
      height: 28px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--surface-strong);

      color: var(--primary);

      border: 1px solid var(--border);

      flex: 0 0 auto;
    }


    .redirect-icon svg {
      width: 15px;
      height: 15px;

      stroke: currentColor;
      stroke-width: 2;

      fill: none;
    }


    .redirect-text {
      font-size: 0.7rem;
      font-weight: 700;

      color: var(--text-secondary);
    }


    #countdown {
      color: var(--primary);

      font-family: var(--font-mono);

      font-weight: 800;
    }


    #pauseBtn {
      padding: 5px 7px;

      background: transparent;

      color: var(--text-muted);

      font-size: 0.66rem;
      font-weight: 800;

      cursor: pointer;

      border-radius: 7px;

      transition:
        color 0.2s ease,
        background-color 0.2s ease;
    }


    #pauseBtn:hover {
      color: var(--primary);
      background: var(--surface-strong);
    }


    .progress-track {
      width: 100%;
      height: 5px;

      overflow: hidden;

      border-radius: 10px;

      background: var(--surface-strong);

      border: 1px solid var(--border);
    }


    #progressBar {
      width: 100%;
      height: 100%;

      border-radius: inherit;

      background: var(--gradient);

      transform-origin: left center;

      transition:
        width 1s linear;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 15px;

      text-align: center;

      color: var(--text-muted);

      font-size: 0.61rem;

      font-weight: 700;
    }


    .footer strong {
      color: var(--primary);
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (min-width: 700px) {
      body {
        padding-left: 24px;
        padding-right: 24px;
      }

      .topbar {
        padding-left: 28px;
        padding-right: 28px;
      }

      .error-card {
        padding:
          42px
          34px
          27px;
      }
    }


    @media (max-height: 680px) {
      body {
        align-items: flex-start;

        overflow-y: auto;

        padding-top:
          calc(82px + env(safe-area-inset-top));
      }

      .error-card {
        margin-bottom: 20px;
      }

      .status-icon {
        width: 60px;
        height: 60px;

        margin-bottom: 13px;
      }

      .error-code {
        font-size: 4rem;
      }

      .error-description {
        margin-bottom: 16px;
      }

      .location-chip {
        margin-bottom: 15px;
      }

      .redirect-panel {
        margin-top: 13px;
      }
    }


    @media (max-width: 380px) {
      .topbar {
        padding-left: 13px;
        padding-right: 13px;
      }

      .brand {
        font-size: 0.9rem;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
      }

      #themeLabel {
        display: none;
      }

      #themeBtn {
        padding-right: 7px;
      }

      .error-card {
        padding:
          29px
          16px
          20px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .action {
        min-height: 46px;
      }
    }


    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    :focus-visible {
      outline:
        3px solid var(--glow-strong);

      outline-offset: 3px;
    }


    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>


<body>

  <!-- =======================================================
       BACKGROUND
       ======================================================= -->

  <div class="page-background" aria-hidden="true">
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>


  <!-- =======================================================
       TOP BAR
       ======================================================= -->

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
      aria-label="GENIQ Homepage"
    >

      <span class="brand-mark">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M12 2L2 7l10 5 10-5-10-5Z"
            stroke="currentColor"

            stroke-linejoin="round"
          />

          <path
            d="M2 17l10 5 10-5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M2 12l10 5 10-5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </span>

      <span class="brand-name">

      </span>

    </a>


    <!--
      IMPORTANT:

    <button

    >

      <span id="themeIconWrap">

  </header>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="error-shell">

    <section
      class="error-card"
      aria-labelledby="errorTitle"
    >

      <div class="card-content">

        <!-- Status -->
        <div
          class="status-icon"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <circle
              cx="12"
              cy="12"

            />

            <path
              d="M12 7.5v5"

            <path
              d="M12 16.5h.01"
            />

          </svg>

        </div>


        <!-- Error Code -->
        <div
          class="error-code"

        >
          404
        </div>

        <h1
          class="error-title"
          id="errorTitle"

          Page Not Found
        </h1>

        </p>


        <!-- Location -->

          <span

          GENIQ / ERROR_404

        <div class="actions">

          <a

          >

              />

              <path

        <!-- Redirect -->
        <div

                <svg viewBox="0 0 24 24">

                  />

                  <path d="M12 7v5l3 2" />

              </span>

            <div
              id="progressBar"

        <!-- Footer -->
        <div class="footer">

        </div>

      </div>

    </section>

  </main>


  <!-- =======================================================
       PAGE LOGIC
       Theme logic intentionally NOT included here.
       theme.js remains the single source of truth.
       ======================================================= -->

  <script>
    (() => {
      "use strict";

      /* -------------------------------------------------------
         Safe Back Navigation
         ------------------------------------------------------- */

      const backButton =
        document.getElementById("backBtn");

      if (backButton) {
        backButton.addEventListener("click", () => {

          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = "index.html";
          }

        });
      }


      /* -------------------------------------------------------
         Redirect Timer
         ------------------------------------------------------- */

      const countdown =
        document.getElementById("countdown");

      const progress =
        document.getElementById("progressBar");

      const pauseButton =
        document.getElementById("pauseBtn");


      const TOTAL_SECONDS = 10;

      let remaining = TOTAL_SECONDS;
      let paused = false;


      function updateTimer() {

        if (countdown) {
          countdown.textContent =
            String(Math.max(remaining, 0));
        }


        if (progress) {
          const percentage =
            (remaining / TOTAL_SECONDS) * 100;

          progress.style.width =
            `${Math.max(percentage, 0)}%`;
        }

      }


      function redirectHome() {
        window.location.href = "index.html";
      }


      const timer =
        window.setInterval(() => {

          if (paused) {
            return;
          }

          remaining -= 1;

          updateTimer();


          if (remaining <= 0) {

            window.clearInterval(timer);

            redirectHome();

          }

        }, 1000);


      if (pauseButton) {

        pauseButton.addEventListener("click", () => {

          paused = !paused;


          if (paused) {

            pauseButton.textContent =
              "Resume";

            pauseButton.setAttribute(
              "aria-label",
              "Resume automatic redirect"
            );

          } else {

            pauseButton.textContent =
              "Pause";

            pauseButton.setAttribute(
              "aria-label",
              "Pause automatic redirect"
            );

          }

        });

      }


      /* -------------------------------------------------------
         Subtle Pointer Interaction
         ------------------------------------------------------- */

      const card =
        document.querySelector(".error-card");

      const backgroundOrb =
        document.querySelector(".orb.three");


      if (
        card &&
        backgroundOrb &&
        window.matchMedia("(pointer: fine)").matches
      ) {

        let frame = null;


        document.addEventListener(
          "pointermove",
          (event) => {

            if (frame) {
              cancelAnimationFrame(frame);
            }


            frame =
              requestAnimationFrame(() => {

                const x =
                  (event.clientX /
                    window.innerWidth -
                    0.5) * 10;

                const y =
                  (event.clientY /
                    window.innerHeight -
                    0.5) * 10;


                card.style.transform =
                  `translate3d(${x * 0.22}px, ${y * 0.22}px, 0)`;


                backgroundOrb.style.transform =
                  `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

              });

          }
        );


        document.addEventListener(
          "pointerleave",
          () => {

            card.style.transform =
              "translate3d(0,0,0)";

            backgroundOrb.style.transform =
              "translate(-50%, -50%)";

          }
        );

      }


      /* -------------------------------------------------------
         Initial Timer State
         ------------------------------------------------------- */

      updateTimer();

    })();
  </script>

</body>
</html>
