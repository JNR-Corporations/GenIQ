
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>GENIQ</title>
  <meta name="description" content="GENIQ - JEE Main & Advanced preparation platform.">

  <script>
    (() => {
      "use strict";

      function redirectByDevice() {
        const isAndroid = /Android/i.test(navigator.userAgent);
        const target = isAndroid ? "android.html" : "desktop.html";

        if (location.pathname.endsWith(target)) return;

        window.location.replace(target);
      }

      // Normal first load
      redirectByDevice();

      // Runs again when browser restores index.html from Back/Forward cache
      window.addEventListener("pageshow", redirectByDevice);
    })();
  </script>
</head>

<body>
  <noscript>
    <a href="desktop.html">Open GENIQ</a>
  </noscript>
</body>
</html>
