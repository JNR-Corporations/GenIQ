<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GENIQ - Authentication</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js" defer></script>
</head>
<body>

  <!-- BACKGROUND GLOW EFFECTS -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- MAIN AUTH CONTAINER -->
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Top Action Bar (Theme Toggle) -->
      <div class="auth-top-bar">
        <div class="version-tag">
          <span class="pulse-dot"></span>
          <span>v3.0 JEE</span>
        </div>
        <button id="themeBtn" class="theme-toggle-btn" aria-label="Switch theme">
          <svg id="themeIcon" class="svg-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Icon initialized automatically by theme.js -->
          </svg>
        </button>
      </div>

      <!-- App Branding Header -->
      <div class="auth-header">
        <div class="brand-logo-box">
          <svg class="brand-logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <h2 id="authHeading">Welcome Back</h2>
        <p id="authSubheading" class="auth-sub">Sign in to continue your JEE preparation</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-toggle-pill">
        <button id="tabLogin" class="auth-tab active" onclick="switchAuthMode('login')">Login</button>
        <button id="tabSignup" class="auth-tab" onclick="switchAuthMode('signup')">Sign Up</button>
        <div class="tab-indicator"></div>
      </div>

      <!-- Alert Bar -->
      <div id="alertBox" class="auth-alert hidden"></div>

      <!-- Google Sign In Button -->
      <button id="googleAuthBtn" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="googleBtnText">Continue with Google</span>
      </button>

      <div class="divider">
        <span>OR EMAIL</span>
      </div>

      <!-- Auth Form -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        
        <!-- Full Name (Only for Signup) -->
        <div id="nameFieldGroup" class="form-group hidden">
          <label>Full Name</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="fullNameInput" placeholder="Raj Verma">
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="emailInput" required placeholder="student@geniq.app">
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="label-row">
            <label>Password</label>
            <a href="#" id="forgotPasswordLink" class="forgot-link" onclick="handleForgotPassword(event)">Forgot?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="passwordInput" required placeholder="••••••••">
            <button type="button" class="eye-toggle" onclick="togglePasswordVisibility()">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="auth-submit-btn">
          <span id="submitBtnText">Sign In</span>
          <div id="btnSpinner" class="btn-spinner hidden"></div>
        </button>
      </form>

      <!-- Footer Note -->
      <div class="auth-footer-note">
        Crafted with <span class="heart-pulse">❤️</span> for JEE Aspirants
      </div>

    </div>
  </div>

  <!-- FIREBASE AUTHENTICATION LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyD0g5GaftqXSx6izoelU4wu6XpcQ8k0060",
      authDomain: "geniq-jnr.firebaseapp.com",
      projectId: "geniq-jnr",
      storageBucket: "geniq-jnr.firebasestorage.app",
      messagingSenderId: "404010970715",
      appId: "1:404010970715:web:1b6bcb7e1ad1434733997e",
      measurementId: "G-NKR2H63G1J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let currentMode = 'login';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("Logged in user:", user);
      }
    });

    window.switchAuthMode = function(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const nameGroup = document.getElementById('nameFieldGroup');
      const heading = document.getElementById('authHeading');
      const subheading = document.getElementById('authSubheading');
      const submitBtnText = document.getElementById('submitBtnText');
      const forgotLink = document.getElementById('forgotPasswordLink');
      const indicator = document.querySelector('.tab-indicator');

      hideAlert();

      if (mode === 'signup') {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        indicator.style.transform = 'translateX(100%)';
        nameGroup.classList.remove('hidden');
        heading.innerText = "Create Account";
        subheading.innerText = "Join GENIQ to access 500+ JEE Modules";
        submitBtnText.innerText = "Create Account";
        forgotLink.style.display = "none";
      } else {
        tabSignup.classList.remove('active');
        tabLogin.classList.add('active');
        indicator.style.transform = 'translateX(0%)';
        nameGroup.classList.add('hidden');
        heading.innerText = "Welcome Back";
        subheading.innerText = "Sign in to continue your JEE preparation";
        submitBtnText.innerText = "Sign In";
        forgotLink.style.display = "block";
      }
    };

    window.togglePasswordVisibility = function() {
      const passInput = document.getElementById('passwordInput');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    };

    window.handleAuthSubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const fullName = document.getElementById('fullNameInput').value.trim();

      setLoading(true);
      hideAlert();

      try {
        if (currentMode === 'signup') {
          if (!fullName) throw new Error("Please enter your full name.");
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(userCredential.user, { displayName: fullName });
          showAlert("Account created successfully!", "success");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showAlert("Logged in successfully!", "success");
        }
      } catch (error) {
        showAlert(formatFirebaseError(error.message), "error");
      } finally {
        setLoading(false);
      }
    };

    document.getElementById('googleAuthBtn').addEventListener('click', async () => {
      hideAlert();
      try {
        await signInWithPopup(auth, googleProvider);
        showAlert("Authenticated with Google successfully!", "success");
      } catch (error) {
        showAlert(formatFirebaseError(error.message), "error");
      }
    });

    window.handleForgotPassword = async function(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      if (!email) {
        showAlert("Please enter your email address first.", "error");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showAlert("Password reset link sent to your email!", "success");
      } catch (error) {
        showAlert(formatFirebaseError(error.message), "error");
      }
    };

    function setLoading(isLoading) {
      const btnText = document.getElementById('submitBtnText');
      const spinner = document.getElementById('btnSpinner');
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.classList.add('hidden');
        spinner.classList.remove('hidden');
      } else {
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    }

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerText = msg;
      alertBox.className = `auth-alert ${type}`;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.add('hidden');
    }

    function formatFirebaseError(msg) {
      if (msg.includes('auth/invalid-credential') || msg.includes('auth/wrong-password')) return "Invalid email or password.";
      if (msg.includes('auth/email-already-in-use')) return "Email is already registered. Please login.";
      if (msg.includes('auth/weak-password')) return "Password should be at least 6 characters.";
      return msg.replace('Firebase: ', '');
    }


    const authBtn = document.getElementById("geniqAuthBtn");
const authBtnText = document.getElementById("geniqAuthBtnText");
const authIcon = document.getElementById("geniqAuthIcon");

onAuthStateChanged(auth, (user) => {

  if (user) {

    authBtnText.textContent = "Logout";

    authIcon.innerHTML = `
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <path d="m16 17 5-5-5-5"></path>
      <path d="M21 12H9"></path>
    `;

    authBtn.onclick = async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Logout failed:", error);
      }
    };

  } else {

    authBtnText.textContent = "Login";

    authIcon.innerHTML = `
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
      <path d="M10 17l5-5-5-5"></path>
      <path d="M15 12H3"></path>
    `;

    authBtn.onclick = () => {
      window.location.href = "login.html";
    };

  }

});
  </script>
</body>
</html>
